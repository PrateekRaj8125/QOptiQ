services:
  api:
    build: .
    container_name: qoptiq-api
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QOPTIQ_SQLITE_PATH: /app/data/qoptiq_jobs.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - qoptiq_data:/app/data
      - ./models:/app/models:ro
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: qoptiq-frontend
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  qoptiq_data:
